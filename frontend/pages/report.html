<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon.png">
  <title>Progress Report – StemNest Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <script src="../js/auth-guard.js"></script>
  <style>
    :root {
      --ink: #1a202c; --muted: #64748b; --line: #e2e8f0; --bg: #f1f5fb; --card: #ffffff;
      --blue: #1a56db; --green: #16a34a; --amber: #f59e0b; --red: #dc2626; --purple: #7c3aed; --grey: #cbd5e1;
      --green-bg: #dcfce7; --blue-bg: #dbeafe; --amber-bg: #fef3c7; --grey-bg: #f1f5f9;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Nunito', sans-serif; }
    .bar-top { max-width: 900px; margin: 0 auto; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .bar-top a { color: var(--blue); font-weight: 800; text-decoration: none; font-size: 14px; }
    .btn { background: var(--blue); color: #fff; border: none; border-radius: 50px; padding: 11px 22px; font-family: inherit; font-weight: 900; font-size: 14px; cursor: pointer; }
    .btn:disabled { opacity: .6; cursor: wait; }
    #report { position: relative; max-width: 900px; margin: 0 auto 40px; background: var(--card); border-radius: 22px; padding: 28px 30px; box-shadow: 0 6px 30px rgba(15,23,42,.08); overflow: hidden; }
    .wm { position: absolute; inset: 0; background: url('../assets/icons/icon.png') center 45% / 62% no-repeat; opacity: .045; pointer-events: none; }
    .pdf-mode .wm { display: none; }
    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; border-bottom: 3px solid var(--blue); padding-bottom: 16px; margin-bottom: 20px; position: relative; }
    .head img { height: 58px; }
    .head .who { text-align: right; }
    .head .kind { font-family: 'Fredoka One', cursive; font-size: 26px; color: var(--blue); line-height: 1.1; }
    .head .name { font-size: 20px; font-weight: 900; margin-top: 2px; }
    .head .meta { font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 2px; }
    h2 { font-family: 'Fredoka One', cursive; font-weight: 400; font-size: 21px; margin: 0 0 4px; }
    .sub { font-size: 13px; color: var(--muted); font-weight: 700; margin: 0 0 12px; }
    .section { position: relative; margin-bottom: 22px; page-break-inside: avoid; break-inside: avoid; }
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .tile { border-radius: 16px; padding: 14px 12px; text-align: center; border: 2px solid var(--line); background: #fff; }
    .tile .ic { font-size: 26px; }
    .tile .big { font-family: 'Fredoka One', cursive; font-size: 28px; line-height: 1.1; margin: 4px 0 2px; }
    .tile .lbl { font-size: 12px; font-weight: 800; color: var(--muted); }
    .tile .word { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 900; padding: 3px 10px; border-radius: 50px; }
    .g { background: var(--green-bg); color: #166534; border-color: #86efac; }
    .b { background: var(--blue-bg); color: #1e40af; border-color: #93c5fd; }
    .a { background: var(--amber-bg); color: #92400e; border-color: #fcd34d; }
    .n { background: var(--grey-bg); color: #475569; border-color: var(--line); }
    .card { border: 2px solid var(--line); border-radius: 16px; padding: 16px 18px; background: rgba(255,255,255,.92); }
    .stack { display: flex; height: 30px; border-radius: 50px; overflow: hidden; background: var(--grey-bg); margin: 8px 0 10px; }
    .stack div { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 13px; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; font-weight: 800; }
    .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
    .say { font-size: 15px; font-weight: 700; line-height: 1.55; margin: 8px 0 0; }
    .prow { display: grid; grid-template-columns: minmax(120px, 1.3fr) 2fr 120px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; font-weight: 800; }
    .prow:last-child { border-bottom: none; }
    .track { height: 16px; background: var(--grey-bg); border-radius: 50px; overflow: hidden; }
    .track > div { height: 100%; border-radius: 50px; }
    .chip { font-size: 11px; font-weight: 900; padding: 3px 9px; border-radius: 50px; text-align: center; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .stars { color: var(--amber); font-size: 22px; letter-spacing: 2px; white-space: nowrap; }
    .stars .off { color: #e2e8f0; }
    .srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; flex-wrap: wrap; }
    .srow:last-child { border-bottom: none; }
    .quote { background: #f8fafc; border-left: 5px solid var(--purple); border-radius: 12px; padding: 14px 16px; font-size: 15px; font-weight: 600; line-height: 1.6; white-space: pre-wrap; }
    .quote.rec { border-left-color: var(--green); }
    .key { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; font-weight: 800; color: var(--muted); }
    .key span { padding: 4px 10px; border-radius: 50px; }
    .foot { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 11px; color: #94a3b8; font-weight: 700; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .msg { max-width: 600px; margin: 60px auto; text-align: center; font-weight: 800; color: var(--muted); padding: 0 16px; }
    @media (max-width: 680px) {
      #report { padding: 20px 16px; border-radius: 0; }
      .tiles { grid-template-columns: repeat(2, 1fr); }
      .two { grid-template-columns: 1fr; }
      .head .who { text-align: left; }
      .prow { grid-template-columns: 1fr 90px; }
      .prow .track { grid-column: 1 / -1; grid-row: 2; }
    }
    @media print {
      body { background: #fff; }
      .bar-top { display: none; }
      #report { box-shadow: none; margin: 0; max-width: none; border-radius: 0; }
      .wm { position: fixed; }
    }
  </style>
</head>
<body>
  <div class="bar-top">
    <a href="student-dashboard.html" id="backLink">← Back to dashboard</a>
    <button class="btn" id="pdfBtn" style="display:none;">⬇️ Download PDF</button>
  </div>
  <div id="report"><div class="msg">Loading the report…</div></div>

  <script src="../js/api.js"></script>
  <script src="../js/report-view.js?v=202610111800"></script>
</body>
</html>
