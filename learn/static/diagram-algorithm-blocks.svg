<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 590" width="560" height="590" role="img" aria-label="The three building blocks of an algorithm: sequence, selection and repetition" font-family="Nunito, system-ui, Segoe UI, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#475569"/></marker></defs>
<rect width="560" height="590" rx="18" fill="#f6f8fc"/>
<text x="24" y="40" font-size="22" font-weight="800" fill="#1a56db">1. Sequence: one step after another</text>
<rect x="24" y="58" width="150" height="58" rx="13" fill="#1a56db"/>
<text x="99" y="94" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Toast first</text>
<rect x="210" y="58" width="150" height="58" rx="13" fill="#1a56db"/>
<text x="285" y="94" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Then butter</text>
<rect x="396" y="58" width="140" height="58" rx="13" fill="#1a56db"/>
<text x="466" y="94" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Then eat</text>
<path d="M176 87H204" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<path d="M362 87H390" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<text x="24" y="170" font-size="22" font-weight="800" fill="#7c3aed">2. Selection: making a decision</text>
<path d="M150 186L276 246L150 306L24 246Z" fill="#7c3aed"/>
<text x="150" y="240" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">Is it</text>
<text x="150" y="263" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">raining?</text>
<rect x="346" y="184" width="190" height="52" rx="13" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
<text x="441" y="217" text-anchor="middle" font-size="19" font-weight="800" fill="#172033">Take an umbrella</text>
<rect x="346" y="256" width="190" height="52" rx="13" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
<text x="441" y="289" text-anchor="middle" font-size="19" font-weight="800" fill="#172033">Wear sunglasses</text>
<path d="M262 236L340 212" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<path d="M262 256L340 280" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<text x="272" y="206" font-size="17" font-weight="800" fill="#475569">Yes</text>
<text x="272" y="304" font-size="17" font-weight="800" fill="#475569">No</text>
<text x="24" y="362" font-size="22" font-weight="800" fill="#0e9f6e">3. Repetition: doing it again</text>
<rect x="24" y="382" width="220" height="62" rx="13" fill="#0e9f6e"/>
<text x="134" y="420" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Do a star jump</text>
<path d="M246 413H310V510H134V450" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<text x="330" y="440" font-size="19" font-weight="800" fill="#172033">Repeat 10 times,</text>
<text x="330" y="466" font-size="17" fill="#475569">then stop</text>
<text x="280" y="566" text-anchor="middle" font-size="17" fill="#475569">Put these three together to describe almost anything</text>
</svg>
