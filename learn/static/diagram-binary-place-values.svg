<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="560" height="270" role="img" aria-label="The binary number 1011 equals 8 plus 2 plus 1, which is 11" font-family="Nunito, system-ui, Segoe UI, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#475569"/></marker></defs>
<rect width="560" height="270" rx="18" fill="#f6f8fc"/>
<text x="280" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#172033">Each place is worth double the one on its right</text>
<text x="49" y="84" text-anchor="middle" font-size="21" font-weight="800" fill="#475569">128</text><rect x="20" y="98" width="58" height="64" rx="10" fill="#ffffff" stroke="#1a56db" stroke-width="2"/><text x="49" y="141" text-anchor="middle" font-size="30" font-weight="800" fill="#94a3b8">0</text>
<text x="115" y="84" text-anchor="middle" font-size="21" font-weight="800" fill="#475569">64</text><rect x="86" y="98" width="58" height="64" rx="10" fill="#ffffff" stroke="#1a56db" stroke-width="2"/><text x="115" y="141" text-anchor="middle" font-size="30" font-weight="800" fill="#94a3b8">0</text>
<text x="181" y="84" text-anchor="middle" font-size="21" font-weight="800" fill="#475569">32</text><rect x="152" y="98" width="58" height="64" rx="10" fill="#ffffff" stroke="#1a56db" stroke-width="2"/><text x="181" y="141" text-anchor="middle" font-size="30" font-weight="800" fill="#94a3b8">0</text>
<text x="247" y="84" text-anchor="middle" font-size="21" font-weight="800" fill="#475569">16</text><rect x="218" y="98" width="58" height="64" rx="10" fill="#ffffff" stroke="#1a56db" stroke-width="2"/><text x="247" y="141" text-anchor="middle" font-size="30" font-weight="800" fill="#94a3b8">0</text>
<text x="313" y="84" text-anchor="middle" font-size="21" font-weight="800" fill="#475569">8</text><rect x="284" y="98" width="58" height="64" rx="10" fill="#1a56db" stroke="#1a56db" stroke-width="2"/><text x="313" y="141" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">1</text>
<text x="379" y="84" text-anchor="middle" font-size="21" font-weight="800" fill="#475569">4</text><rect x="350" y="98" width="58" height="64" rx="10" fill="#ffffff" stroke="#1a56db" stroke-width="2"/><text x="379" y="141" text-anchor="middle" font-size="30" font-weight="800" fill="#94a3b8">0</text>
<text x="445" y="84" text-anchor="middle" font-size="21" font-weight="800" fill="#475569">2</text><rect x="416" y="98" width="58" height="64" rx="10" fill="#1a56db" stroke="#1a56db" stroke-width="2"/><text x="445" y="141" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">1</text>
<text x="511" y="84" text-anchor="middle" font-size="21" font-weight="800" fill="#475569">1</text><rect x="482" y="98" width="58" height="64" rx="10" fill="#1a56db" stroke="#1a56db" stroke-width="2"/><text x="511" y="141" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">1</text>
<text x="280" y="208" text-anchor="middle" font-size="22" font-weight="800" fill="#1a56db">8 + 2 + 1 = 11</text>
<text x="280" y="242" text-anchor="middle" font-size="18" fill="#475569">So binary 1011 is the number 11</text>
</svg>
