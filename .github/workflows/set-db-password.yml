name: Set database password

# Run by hand (Actions → "Set database password" → Run workflow) after
# resetting the Supabase password. The new password is read from the
# repository secret DB_PASSWORD and written into the server's backend/.env;
# it is never printed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  set-password:
    name: Update DATABASE_URL on the server
    runs-on: ubuntu-latest
    steps:
      - name: Write the password and restart the API
        uses: appleboy/ssh-action@v1.2.5
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PASSWORD
          script: |
            set -e
            cd /home/ubuntu/stemnest-academy/backend
            if [ -z "$DB_PASSWORD" ]; then echo "DB_PASSWORD secret is empty or missing"; exit 1; fi
            case "$DB_PASSWORD" in *[!A-Za-z0-9]*) echo "Password has special characters - not handled by this job"; exit 1;; esac
            cp .env "/home/ubuntu/env-backup-$(date +%Y%m%d-%H%M%S)"
            sed -i -E "s#^(DATABASE_URL=[\"']?postgres(ql)?://[^:]+:)[^@]*@#\1${DB_PASSWORD}@#" .env
            grep '^DATABASE_URL=' .env | sed -E 's#^(DATABASE_URL=[^:]+://[^:]+:)([^@]*)(@.*)$#\1|\2|\3#' | awk -F'|' '{print "password now " length($2) " characters"}'
            pm2 reload stemnest-api --update-env
            sleep 8
            curl -s -o /dev/null -w "courses endpoint: %{http_code}\n" http://localhost:3000/api/courses
