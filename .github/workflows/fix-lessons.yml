name: Run Lesson Number Fix (one-time)

on:
  workflow_dispatch:

jobs:
  fix-lessons:
    name: Fix Lesson Numbers on EC2
    runs-on: ubuntu-latest
    steps:
      - name: Run fix via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/stemnest-academy/backend
            node fix-lesson-numbers.js
