name: Restore database connection

# Run by hand. Puts back the DATABASE_URL from the backup taken before the
# password change (~/env-backup-6oct) and keeps the new password (secret
# DB_PASSWORD) as DB_PASSWORD_NEXT, so the API switches to it by itself when
# Supabase's pooler starts using the new password. Nothing is printed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  restore:
    name: Restore DATABASE_URL and restart the API
    runs-on: ubuntu-latest
    steps:
      - name: Restore, test, restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PASSWORD
          script: |
            set -e
            cd /home/ubuntu/stemnest-academy/backend
            B=/home/ubuntu/env-backup-6oct
            [ -f "$B" ] || { echo "Backup $B not found"; exit 1; }
            OLDLINE=$(grep '^DATABASE_URL=' "$B" | head -1)
            OLDLEN=$(printf '%s' "$OLDLINE" | tr -d '\r' | sed -E 's#^DATABASE_URL=[^:]+://[^:]+:([^@]*)@.*$#\1#' | awk '{print length($0)}')
            echo "backup password length: $OLDLEN"
            [ "$OLDLEN" -gt 0 ] || { echo "Backup has no password"; exit 1; }
            cp .env "/home/ubuntu/env-before-restore-$(date +%Y%m%d-%H%M%S)"
            grep -v '^DATABASE_URL=' .env | grep -v '^DB_PASSWORD_NEXT=' > .env.new
            printf '%s\n' "$OLDLINE" >> .env.new
            if [ -n "$DB_PASSWORD" ]; then printf 'DB_PASSWORD_NEXT=%s\n' "$DB_PASSWORD" >> .env.new; echo "next password kept (${#DB_PASSWORD} chars)"; fi
            mv .env.new .env
            echo "== testing with the API's own connection code =="
            node -e "require('dotenv').config(); process.env.NODE_ENV='production'; const pool=require('./src/config/db'); pool.query('SELECT 1').then(()=>{console.log('DB CONNECT OK');process.exit(0)}).catch(e=>{console.log('DB CONNECT ERROR:', String(e.message).replace(/:\/\/[^@]*@/g,'://***@'));process.exit(0)})"
            pm2 reload stemnest-api --update-env
            sleep 10
            curl -s -o /dev/null -w "courses endpoint: %{http_code}\n" http://localhost:3000/api/courses
