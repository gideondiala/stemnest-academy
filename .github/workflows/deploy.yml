name: Deploy StemNest Academy

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

# Never run two deploys at once — overlapping `npm ci` + `pm2 reload` on the
# server left node_modules half-installed and took the API down (1 Oct 2026).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend --project-name=stemnest-academy --branch=main

  deploy-backend:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/stemnest-academy
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            cd backend
            npm ci --omit=dev
            pm2 reload stemnest-api --update-env
            pm2 status
