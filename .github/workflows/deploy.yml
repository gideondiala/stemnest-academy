name: Deploy StemNest Academy

on:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Deploy frontend to Cloudflare Pages
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: stemnest-academy
          directory: frontend
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 2: Deploy backend to EC2
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → EC2
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/stemnest-academy

            echo "📥 Pulling latest code..."
            git pull origin main

            echo "📦 Installing dependencies..."
            cd backend
            npm ci --omit=dev

            echo "🔄 Running migrations..."
            npm run migrate

            echo "🚀 Reloading API (zero downtime)..."
            pm2 reload stemnest-api --update-env

            echo "✅ Deployment complete!"
            pm2 status
